<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Travel Explorer - Discover amazing destinations worldwide with real-time weather information and stunning photography. Plan your next adventure with ease.">
    <meta name="keywords" content="travel, destinations, weather, trip planning, travel explorer, vacation planning">
    <meta name="author" content="Travel Explorer">
    <meta property="og:title" content="Travel Explorer - Discover Your Next Adventure">
    <meta property="og:description" content="Explore destinations worldwide with real-time weather and beautiful photography">
    <meta property="og:type" content="website">
    <title>Travel Explorer - Discover Your Next Adventure | Weather & Destination Guide</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            min-height: 100vh;
            color: #fff;
            position: relative;
            overflow-x: hidden;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Animated background particles */
        .bg-decoration {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            animation: float 20s infinite;
        }

        .particle:nth-child(1) { width: 80px; height: 80px; left: 10%; animation-delay: 0s; }
        .particle:nth-child(2) { width: 60px; height: 60px; left: 30%; animation-delay: 2s; }
        .particle:nth-child(3) { width: 100px; height: 100px; left: 50%; animation-delay: 4s; }
        .particle:nth-child(4) { width: 70px; height: 70px; left: 70%; animation-delay: 6s; }
        .particle:nth-child(5) { width: 90px; height: 90px; left: 85%; animation-delay: 8s; }

        @keyframes float {
            0%, 100% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 0.3; }
            90% { opacity: 0.3; }
            100% { transform: translateY(-100vh) rotate(360deg); opacity: 0; }
        }

        .skip-link {
            position: absolute;
            top: -40px;
            left: 0;
            background: #667eea;
            color: #fff;
            padding: 8px 16px;
            text-decoration: none;
            z-index: 100;
            border-radius: 4px;
        }

        .skip-link:focus {
            top: 10px;
            left: 10px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        /* Header with glass morphism */
        header {
            text-align: center;
            padding: 60px 30px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            margin-bottom: 40px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.2),
                        inset 0 1px 1px rgba(255, 255, 255, 0.3);
            border: 2px solid rgba(255, 255, 255, 0.2);
            animation: fadeInDown 1s ease;
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-50px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .hero-icon {
            font-size: 5rem;
            display: block;
            margin-bottom: 20px;
            animation: bounce 2s infinite;
            filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.3));
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        h1 {
            font-size: clamp(2.5rem, 6vw, 4.5rem);
            font-weight: 800;
            background: linear-gradient(135deg, #fff 0%, #ffd700 50%, #ff6b6b 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 20px;
            animation: shimmer 3s linear infinite;
            text-shadow: 0 0 30px rgba(255, 255, 255, 0.5);
        }

        @keyframes shimmer {
            to { background-position: 200% center; }
        }

        .tagline {
            font-size: clamp(1.1rem, 2.5vw, 1.5rem);
            color: #fff;
            margin-bottom: 40px;
            font-weight: 400;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }

        /* Search section with glow effect */
        .search-section {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            padding: 40px;
            border-radius: 25px;
            margin-bottom: 40px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            animation: fadeInUp 1s ease 0.3s both;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(50px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .search-form {
            display: flex;
            gap: 15px;
            max-width: 700px;
            margin: 0 auto;
            flex-wrap: wrap;
            justify-content: center;
        }

        .search-label {
            position: absolute;
            left: -10000px;
            width: 1px;
            height: 1px;
            overflow: hidden;
        }

        .search-input {
            flex: 1;
            min-width: 280px;
            padding: 18px 30px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50px;
            font-size: 17px;
            background: rgba(255, 255, 255, 0.9);
            color: #333;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .search-input:focus {
            outline: none;
            border-color: #ffd700;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.5),
                        0 0 60px rgba(255, 215, 0, 0.3);
            transform: scale(1.02);
            background: #fff;
        }

        .search-input::placeholder {
            color: #999;
        }

        .btn {
            padding: 18px 45px;
            border: none;
            border-radius: 50px;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.4s ease;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .btn:hover::before {
            width: 300px;
            height: 300px;
        }

        .btn:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 15px 40px rgba(102, 126, 234, 0.6);
        }

        .btn:active {
            transform: translateY(0) scale(0.98);
        }

        /* Popular destinations with colorful cards */
        .popular-section {
            margin-bottom: 60px;
            animation: fadeInUp 1s ease 0.6s both;
        }

        .section-title {
            font-size: clamp(2rem, 4vw, 3rem);
            font-weight: 700;
            margin-bottom: 30px;
            text-align: center;
            text-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .destination-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 20px;
        }

        .destination-chip {
            padding: 20px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.2), rgba(255, 255, 255, 0.1));
            backdrop-filter: blur(10px);
            color: #fff;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.4s ease;
            font-weight: 600;
            text-align: center;
            font-size: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            position: relative;
            overflow: hidden;
        }

        .destination-chip::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.5s;
        }

        .destination-chip:hover::before {
            left: 100%;
        }

        .destination-chip:hover {
            transform: translateY(-8px) scale(1.05);
            box-shadow: 0 20px 40px rgba(255, 215, 0, 0.4);
            border-color: #ffd700;
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.3), rgba(255, 107, 107, 0.3));
        }

        /* Results section */
        .results-section {
            display: none;
            margin-top: 60px;
        }

        .results-section.active {
            display: block;
            animation: zoomIn 0.8s ease;
        }

        @keyframes zoomIn {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }

        .destination-header {
            font-size: clamp(2.5rem, 5vw, 4rem);
            font-weight: 800;
            margin-bottom: 40px;
            text-align: center;
            background: linear-gradient(135deg, #ffd700 0%, #ff6b6b 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px rgba(255, 215, 0, 0.5);
        }

        /* Weather card with vibrant design */
        .weather-card {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.2), rgba(255, 255, 255, 0.1));
            backdrop-filter: blur(20px);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 25px;
            padding: 40px;
            margin-bottom: 50px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
        }

        .weather-title {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 30px;
            text-align: center;
            color: #ffd700;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }

        .weather-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 25px;
        }

        .weather-item {
            text-align: center;
            padding: 30px;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.3), rgba(118, 75, 162, 0.3));
            border-radius: 20px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }

        .weather-item:hover {
            transform: translateY(-10px) rotate(2deg);
            box-shadow: 0 20px 40px rgba(255, 215, 0, 0.4);
            border-color: #ffd700;
        }

        .weather-label {
            font-size: 0.9rem;
            color: #ffd700;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 700;
        }

        .weather-value {
            font-size: 3rem;
            font-weight: 800;
            color: #fff;
            text-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        /* Photo gallery with stunning effects */
        .gallery-section {
            margin-top: 50px;
        }

        .gallery-title {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 30px;
            text-align: center;
            color: #ffd700;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }

        .photo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
        }

        .photo-card {
            position: relative;
            border-radius: 20px;
            overflow: hidden;
            height: 350px;
            cursor: pointer;
            transition: all 0.5s ease;
            border: 3px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
        }

        .photo-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.3), rgba(240, 147, 251, 0.3));
            opacity: 0;
            transition: opacity 0.4s ease;
            z-index: 1;
        }

        .photo-card:hover::before {
            opacity: 1;
        }

        .photo-card:hover {
            transform: translateY(-15px) scale(1.03);
            box-shadow: 0 30px 60px rgba(255, 215, 0, 0.5);
            border-color: #ffd700;
        }

        .photo-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .photo-card:hover img {
            transform: scale(1.15);
        }

        .photo-credit {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.9), transparent);
            padding: 20px;
            color: #fff;
            font-size: 0.9rem;
            z-index: 2;
            font-weight: 600;
        }

        /* Loading animation */
        .loading {
            text-align: center;
            padding: 60px 20px;
            font-size: 1.3rem;
            color: #ffd700;
            font-weight: 600;
        }

        .loading::after {
            content: '';
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #ffd700;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 1s linear infinite;
            margin-left: 10px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error-message {
            background: rgba(255, 107, 107, 0.2);
            backdrop-filter: blur(10px);
            border: 2px solid #ff6b6b;
            color: #fff;
            padding: 25px;
            border-radius: 15px;
            margin: 20px 0;
            box-shadow: 0 10px 30px rgba(255, 107, 107, 0.3);
        }

        .error-message strong {
            display: block;
            margin-bottom: 10px;
            font-size: 1.2rem;
        }

        footer {
            margin-top: 80px;
            padding: 40px 0;
            text-align: center;
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.9rem;
        }

        /* Responsive design */
        @media (max-width: 768px) {
            .search-section {
                padding: 30px 20px;
            }

            .search-form {
                flex-direction: column;
            }

            .search-input {
                min-width: 100%;
            }

            .destination-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 15px;
            }

            .weather-grid {
                grid-template-columns: 1fr;
            }

            .photo-grid {
                grid-template-columns: 1fr;
            }

            header {
                padding: 40px 20px;
            }

            .hero-icon {
                font-size: 3.5rem;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <div class="bg-decoration" aria-hidden="true">
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
    </div>

    <a href="#main-content" class="skip-link">Skip to main content</a>

    <div class="container">
        <header role="banner">
            <span class="hero-icon" aria-hidden="true">✈️</span>
            <h1>Travel Explorer</h1>
            <p class="tagline">✨ Discover Your Dream Destinations Worldwide ✨</p>
        </header>

        <main id="main-content" role="main">
            <section class="search-section" aria-label="Destination Search">
                <form class="search-form" onsubmit="event.preventDefault(); searchDestination();" role="search">
                    <label for="searchInput" class="search-label">Search for a destination</label>
                    <input 
                        type="text" 
                        class="search-input" 
                        id="searchInput" 
                        placeholder="🔍 Where do you want to go?"
                        aria-label="Destination search"
                        autocomplete="off"
                    >
                    <button type="submit" class="btn" aria-label="Search destination">
                        <span style="position: relative; z-index: 1;">Explore Now</span>
                    </button>
                </form>
            </section>

            <section class="popular-section" aria-labelledby="popular-title">
                <h2 id="popular-title" class="section-title">🌟 Popular Destinations</h2>
                <div class="destination-grid" role="list">
                    <button class="destination-chip" onclick="selectDestination('Paris')" role="listitem">🗼 Paris</button>
                    <button class="destination-chip" onclick="selectDestination('Tokyo')" role="listitem">🗾 Tokyo</button>
                    <button class="destination-chip" onclick="selectDestination('New York')" role="listitem">🗽 New York</button>
                    <button class="destination-chip" onclick="selectDestination('London')" role="listitem">🎡 London</button>
                    <button class="destination-chip" onclick="selectDestination('Dubai')" role="listitem">🏙️ Dubai</button>
                    <button class="destination-chip" onclick="selectDestination('Barcelona')" role="listitem">🏖️ Barcelona</button>
                    <button class="destination-chip" onclick="selectDestination('Rome')" role="listitem">🏛️ Rome</button>
                    <button class="destination-chip" onclick="selectDestination('Bali')" role="listitem">🏝️ Bali</button>
                    <button class="destination-chip" onclick="selectDestination('Sydney')" role="listitem">🦘 Sydney</button>
                    <button class="destination-chip" onclick="selectDestination('Amsterdam')" role="listitem">🚲 Amsterdam</button>
                </div>
            </section>

            <section class="results-section" id="resultsSection" aria-live="polite" aria-atomic="true">
                <h2 id="destinationTitle" class="destination-header"></h2>
                
                <article class="weather-card" id="weatherInfo" aria-labelledby="weather-title">
                    <h3 id="weather-title" class="weather-title">🌤️ Current Weather</h3>
                </article>

                <article class="gallery-section" id="photoGallery" aria-labelledby="gallery-title">
                    <h3 id="gallery-title" class="gallery-title">📸 Stunning Photos</h3>
                </article>
            </section>
        </main>

        <footer role="contentinfo">
            <p>✨ Travel Explorer © 2025 • Explore the World with Confidence ✨</p>
        </footer>
    </div>

    <script>
        const UNSPLASH_API_KEY = 'CGRDeZVtxkHg-a_qGSR_nXKZXXwzOTkcNnw1B7WwK_g';
        const WEATHER_API_KEY = '2b2ecaa793a1a4da52ca0f09070622c6';

        const searchInput = document.getElementById('searchInput');
        const resultsSection = document.getElementById('resultsSection');
        const destinationTitle = document.getElementById('destinationTitle');
        const weatherInfo = document.getElementById('weatherInfo');
        const photoGallery = document.getElementById('photoGallery');

        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                searchDestination();
            }
        });

        function selectDestination(destination) {
            searchInput.value = destination;
            searchDestination();
        }

        async function searchDestination() {
            const destination = searchInput.value.trim();
            if (!destination) {
                alert('Please enter a destination! 🌍');
                searchInput.focus();
                return;
            }

            resultsSection.classList.add('active');
            destinationTitle.textContent = `🌍 ${destination}`;
            
            weatherInfo.innerHTML = `<h3 id="weather-title" class="weather-title">🌤️ Current Weather</h3><div class="loading">Loading weather data</div>`;
            photoGallery.innerHTML = `<h3 id="gallery-title" class="gallery-title">📸 Stunning Photos</h3><div class="loading">Loading photos</div>`;

            resultsSection.scrollIntoView({ behavior: 'smooth', block: 'start' });

            await Promise.all([
                fetchWeather(destination),
                fetchPhotos(destination)
            ]);
        }

        async function fetchWeather(destination) {
            try {
                const url = `https://api.openweathermap.org/data/2.5/weather?q=${encodeURIComponent(destination)}&appid=${WEATHER_API_KEY}&units=metric`;
                const response = await fetch(url);

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.message || 'Weather data not found');
                }

                const data = await response.json();

                weatherInfo.innerHTML = `
                    <h3 id="weather-title" class="weather-title">🌤️ Current Weather</h3>
                    <div class="weather-grid">
                        <div class="weather-item">
                            <div class="weather-label">🌡️ Temperature</div>
                            <div class="weather-value">${Math.round(data.main.temp)}°C</div>
                        </div>
                        <div class="weather-item">
                            <div class="weather-label">💨 Feels Like</div>
                            <div class="weather-value">${Math.round(data.main.feels_like)}°C</div>
                        </div>
                        <div class="weather-item">
                            <div class="weather-label">☁️ Conditions</div>
                            <div class="weather-value" style="font-size: 1.8rem;">${data.weather[0].main}</div>
                        </div>
                        <div class="weather-item">
                            <div class="weather-label">💧 Humidity</div>
                            <div class="weather-value">${data.main.humidity}%</div>
                        </div>
                    </div>
                `;
            } catch (error) {
                weatherInfo.innerHTML = `
                    <h3 id="weather-title" class="weather-title">🌤️ Current Weather</h3>
                    <div class="error-message" role="alert">
                        <strong>⚠️ Weather Error</strong>
                        <p>Unable to fetch weather data. Please try a different city name!</p>
                    </div>
                `;
            }
        }

        async function fetchPhotos(destination) {
            try {
                const response = await fetch(
                    `https://api.unsplash.com/search/photos?query=${encodeURIComponent(destination)}&per_page=12&client_id=${UNSPLASH_API_KEY}`
                );

                if (!response.ok) {
                    throw new Error('Photos not found');
                }

                const data = await response.json();

                if (data.results.length === 0) {
                    photoGallery.innerHTML = `
                        <h3 id="gallery-title" class="gallery-title">📸 Stunning Photos</h3>
                        <div class="error-message">No photos found for this destination.</div>
                    `;
                    return;
                }

                photoGallery.innerHTML = `
                    <h3 id="gallery-title" class="gallery-title">📸 Stunning Photos</h3>
                    <div class="photo-grid">
                        ${data.results.map(photo => `
                            <div class="photo-card" 
                                 tabindex="0"
                                 role="button"
                                 aria-label="View photo by ${photo.user.name} on Unsplash"
                                 onclick="window.open('${photo.links.html}', '_blank')"
                                 onkeypress="if(event.key==='Enter') window.open('${photo.links.html}', '_blank')">
                                <img src="${photo.urls.regular}" 
                                     alt="${photo.alt_description || `${destination} destination photo`}"
                                     loading="lazy">
                                <div class="photo-credit">
                                    📷 ${photo.user.name}
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
            } catch (error) {
                photoGallery.innerHTML = `
                    <h3 id="gallery-title" class="gallery-title">📸 Stunning Photos</h3>
                    <div class="error-message" role="alert">
                        <strong>⚠️ Photo Error</strong>
                        <p>Unable to load photos. Please try again later!</p>
                    </div>
                `;
            }
        }

        window.addEventListener('load', () => {
            searchInput.focus();
